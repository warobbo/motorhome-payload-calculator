services:
  # Static site. Render Blueprints express that as type: web and runtime: static.
  # This does not convert the existing Node web service. Follow MIGRATION.md:
  # create a new static site, move the domain, then suspend the old service.
  - type: web
    runtime: static
    name: motorhome-payload-calculator
    buildCommand: bash scripts/publish-public.sh
    staticPublishPath: public
    routes:
      - type: redirect
        source: /index.html
        destination: /
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: MISSING_SIZE_ENDPOINT
        sync: false
