services:
  # Live site. Auto-deploy from main runs this Node service until the domain
  # moves. Runtime stays Node so / and /api keep working. Do not change this
  # name or runtime — a Blueprint sync matches the existing service by name.
  # A Free web service answers /robots.txt with Disallow: / while it is spun down.
  # That response is Render's, not robots.txt, and it does not start the app.
  # https://render.com/docs/free#automatic-robotstxt-responses
  - type: web
    name: motorhome-payload-calculator
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DVLA_API_KEY
        sync: false
      - key: MOT_API_KEY
        sync: false
      - key: MISSING_SIZE_LOG_PATH
        sync: false

  # New static site. A different name so a sync cannot convert the Node service.
  # Render Blueprints express a static site as type: web and runtime: static.
  - type: web
    runtime: static
    name: motorhome-payload-static
    buildCommand: bash scripts/publish-public.sh
    staticPublishPath: public
    routes:
      - type: redirect
        source: /index.html
        destination: /
    # Headers apply on a Blueprint sync. A site created by hand needs the
    # same rules in the dashboard. The list is in MIGRATION.md.
    headers:
      - path: "/*"
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'self' https://*.workers.dev https://*.*.workers.dev https://driver-vehicle-licensing.api.gov.uk https://beta.check-mot.service.gov.uk; upgrade-insecure-requests"
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "/*"
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: MISSING_SIZE_ENDPOINT
        sync: false
      - key: VEHICLE_LOOKUP_ENDPOINT
        sync: false
