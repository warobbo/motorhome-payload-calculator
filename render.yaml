services:
  # A Free web service answers /robots.txt with Disallow: / while it is spun down.
  # That response is Render's, not robots.txt, and it does not start the app.
  # https://render.com/docs/free#automatic-robotstxt-responses
  - type: web
    name: motorhome-payload-calculator
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DVLA_API_KEY
        sync: false
      - key: MOT_API_KEY
        sync: false
      - key: MISSING_SIZE_LOG_PATH
        sync: false
